name: Release

# Run manually from the Actions tab. The release version/tag come from the UPM
# package version in package/package.json (independent of SDK_VERSION.txt, which
# only pins which native SDK libs download-sdk.sh fetches).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the package to GitHub Releases'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release (excludes it from releases/latest, breaking the stable download URL). Keep false so the latest/download link resolves.'
        type: boolean
        default: false

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release metadata from package.json
        id: meta
        run: |
          NAME=$(jq -r .name package/package.json)
          VERSION=$(jq -r .version package/package.json)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Fetches the pre-built SpriteStudio SDK libs into the package plugin dirs.
      # ssruntime -> package/Runtime/Plugins/ (iOS/WebGL static, others dynamic);
      # ssconverter -> package/Editor/Plugins/ (win/mac, dynamic only).
      # These binaries are gitignored, so this step is required before packing.
      # NOTE: the SpriteStudio-SDK release is still private, so this step cannot
      # succeed yet. It goes green once that repo/release is made public (planned),
      # at which point download-sdk.sh's plain curl works with no extra auth.
      - name: Download SpriteStudio SDK libs
        run: bash scripts/download-sdk.sh

      # Sanity-check that native libs actually landed in BOTH plugin dirs before
      # packaging. Match any platform binary (static or dynamic) rather than a
      # single VERSION marker, so this keeps holding as the lib set grows.
      - name: Verify SDK libs present
        run: |
          set -e
          for dir in package/Runtime/Plugins package/Editor/Plugins; do
            count=$(find "$dir" -type f \
              \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \
                 -o -name '*.a' -o -name '*.lib' -o -name '*.bundle' \) | wc -l)
            echo "$dir: $count native lib(s)"
            if [ "$count" -eq 0 ]; then
              echo "::error::No native libraries found in $dir"
              exit 1
            fi
          done

          # Every native lib needs a committed .meta beside it. Without one Unity
          # ignores the asset (a UPM package is extracted into an immutable folder),
          # so the tarball would install with no native libs at all, and the three
          # same-named Android libssruntime.so would collide. CI has no Unity to
          # generate these, so a lib whose .meta was never committed is a release
          # blocker, not a warning. Bundles/xcframeworks are directories carrying a
          # sibling .meta, so match those separately from plain files.
          missing=0
          while IFS= read -r lib; do
            [ -e "${lib}.meta" ] && continue
            echo "::error::Native plugin has no committed .meta: $lib"
            missing=$((missing + 1))
          done < <(find package/Runtime/Plugins package/Editor/Plugins \
                     \( -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \
                                   -o -name '*.a' -o -name '*.lib' \) \
                        -o -type d \( -name '*.bundle' -o -name '*.xcframework' \) \) \
                   -not -path '*.bundle/*' -not -path '*.xcframework/*')
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing native plugin(s) missing a .meta - see scripts/scaffold-plugin-placeholders.sh"
            exit 1
          fi
          echo "All native plugins have a .meta."
          # The csbindgen FFI bindings are compile-critical; a tarball without
          # them would not build for consumers. Their .meta matter just as much:
          # a UPM package is extracted into an immutable folder, where Unity
          # ignores any asset that has no .meta — so a binding shipped without
          # one is silently dropped and the package fails to compile. CI has no
          # Unity to generate them, so download-sdk.sh places the committed
          # copies from scripts/upm-meta; assert both landed.
          for f in package/Runtime/Bindings/SSRuntimeMethods.g.cs \
                   package/Editor/Bindings/SSConverterMethods.g.cs; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing FFI binding: $f"
              exit 1
            fi
            if [ ! -f "$f.meta" ]; then
              echo "::error::Missing .meta for FFI binding: $f.meta"
              exit 1
            fi
          done
          ls -R package/Runtime/Plugins package/Editor/Plugins

      # Pack the UPM package as a tarball via `npm pack` (pack-release.sh copies
      # LICENSE / Third Party Notices into package/ and produces `<name>-<version>.tgz`
      # at the repo root). Also make a version-less alias so README/docs can point
      # at a stable `releases/latest/download/<name>.tgz` URL that never goes stale.
      - name: Pack UPM package
        id: pkg
        run: |
          bash scripts/pack-release.sh
          VERSIONED="${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.tgz"
          ALIAS="${{ steps.meta.outputs.name }}.tgz"
          test -f "$VERSIONED"
          cp "$VERSIONED" "$ALIAS"
          # Checksums for both assets. The package ships native binaries, so give
          # consumers the same way to verify a download that download-sdk.sh uses
          # against the SDK zips - same `<sha256>  <filename>` layout, so the same
          # `sha256sum -c` / awk lookup works here.
          sha256sum "$VERSIONED" "$ALIAS" > SHA256SUMS
          cat SHA256SUMS
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          tar -tzf "$VERSIONED" | head -n 20

      # Always keep the package as a workflow artifact so a run is useful even
      # when the Releases upload is turned off.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.versioned }}
          path: ${{ steps.pkg.outputs.versioned }}
          if-no-files-found: error

      # NOTE: the release is created as a DRAFT (draft: true below). Drafts are excluded from
      # `releases/latest`, so the stable download URL used by README/docs
      # (releases/latest/download/jp.co.cri-mw.spritestudio.ssplayer-unity.tgz) does NOT resolve until a
      # human publishes the draft from the GitHub Releases UI. Publishing the draft is also what emits
      # the `release: published` event that triggers the Deploy Pages workflow. So after a green run:
      # review the draft, then click "Publish release" — and keep it a full (non-prerelease) release so
      # `latest` resolves.
      - name: Upload package to release
        if: ${{ inputs.upload }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SSPlayer for Unity ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          # Ship the version-pinned tarball, the stable alias filename, and the
          # checksums covering both.
          files: |
            ${{ steps.pkg.outputs.versioned }}
            ${{ steps.pkg.outputs.alias }}
            SHA256SUMS
