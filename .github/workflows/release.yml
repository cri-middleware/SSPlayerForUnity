name: Release

# Run manually from the Actions tab. A release is a tag: push `v<version>`
# first, then dispatch this workflow from that tag ("Use workflow from" → the
# tag). The tag names the Release, and scripts/build-release.sh reads it from
# the ref rather than being told it.
#
# Dispatching from a branch, or from a tag with upload_release turned off, is a
# package build — the tarball is produced, checked and kept as a workflow
# artifact, and no Release is created.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Draft the GitHub Release, to publish by hand. Only from a v* tag that has no Release yet; from a branch the run is a build.'
        required: false
        default: true
        type: boolean

# Read-only by default; the job that drafts the Release asks for contents: write
# itself.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # softprops/action-gh-release creates the GitHub Release
    env:
      # The signing gate, set once at the job level so the step conditions below
      # can read it -- `secrets` is not available in an `if:`, `env` is. An absent
      # secret is the empty string, which is exactly the "not set" the scripts
      # test for, so this wiring is inert until the secrets exist and the day they
      # do a release is signed with no change here.
      UNITY_ORGANIZATION_ID: ${{ secrets.UNITY_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      # node packs the tarball (`npm pack` applies package.json's "files"
      # allowlist and the package/ root layout UPM expects) and reads the
      # version out of the manifest. Pinned rather than left to whatever the
      # runner image ships, so a release cannot change because the image did.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The ref decides what the run is: a v* tag is a release, anything else is
      # a build, kept on the run and drafting nothing. A tag that already has a
      # Release, draft or published, keeps it as it is, so a run from an old tag
      # rebuilds without touching the files people have downloaded and checked
      # against its SHA256SUMS. To have a Release made again, delete it first.
      - name: Decide on the GitHub Release
        id: release
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::notice::${GITHUB_REF_NAME} is not a v* tag — a build, no Release."; exit 0 ;;
          esac
          if out="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>&1)"; then
            echo "::notice::${GITHUB_REF_NAME} already has a Release — left as it is. Delete it to have it made again."
          elif [ "$out" = "release not found" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      # scripts/build-release.sh IS the release: it fetches the pinned SDK
      # native libs, refuses a tree that would install as nothing (a native
      # plugin with no committed .meta — Unity ignores those inside an immutable
      # package folder, and CI has no Unity to generate one), packs the UPM
      # tarball, writes the stable alias name the README and docs link to, and
      # checks the finished archive really contains what the allowlist was
      # supposed to keep. Every option is spelled out so a release cannot change
      # because a default did, and so this is the command a human runs locally
      # to produce the same three files.
      #
      # Unity 6.3's Package Manager checks every tarball for a signature and tells
      # whoever installs an unsigned one so. `upm pack` -- the standalone UPM CLI,
      # no Editor needed -- packs and signs in one step, and pack-release.sh uses
      # it in place of `npm pack` when UNITY_ORGANIZATION_ID is set. Nothing to do
      # when it is not: the build below packs unsigned and reports it.
      - name: Install the UPM CLI
        if: env.UNITY_ORGANIZATION_ID != ''
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | bash
          # The installer appends the CLI's directory to the shell rc, which a
          # non-interactive `run:` step never sources -- so put it on PATH for the
          # rest of the job explicitly. Where it lands is not documented, so find
          # it rather than hardcode a guess, and fail loudly if it moved.
          UPM_BIN="$(command -v upm || find "$HOME" -maxdepth 4 -type f -name upm -perm -u+x 2>/dev/null | head -1)"
          if [ -z "$UPM_BIN" ]; then
            echo "::error::the UPM CLI installer ran but no 'upm' executable was found"
            exit 1
          fi
          dirname "$UPM_BIN" >> "$GITHUB_PATH"
          "$UPM_BIN" --version

      - name: Build the release
        env:
          # Read by `upm pack` itself. The service account behind them needs the
          # organization's "Package Manager Package Signer" role.
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
        run: ./scripts/build-release.sh sdk=download out=release-dist verify=yes clean=yes

      # Keep the assets on the run even when nothing is uploaded to a Release,
      # so a build from a branch is still useful — and so the tarball a human
      # installs to review is the same bytes the Release would carry.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssplayer-unity-release-dist
          path: release-dist
          if-no-files-found: error
          # A week, not the 90-day default. What is meant to last is attached to
          # the GitHub Release, which never expires; this is a copy for a run
          # that uploaded nothing. Artifact storage is an org-wide quota, and a
          # full one does not degrade — `upload-artifact` fails, so the release
          # build fails, in a step that has nothing to do with the release.
          retention-days: 7

      # The pre-release mark the draft carries: one once a full release is
      # tagged, none before (scripts/release-channel.sh).
      # A patch to an earlier line also names the full release before it in that
      # line, which the generated notes start from instead of the newest release.
      - name: Read the Release's channel
        id: channel
        if: steps.release.outputs.draft == 'true'
        run: |
          channel="$(./scripts/release-channel.sh "$GITHUB_REF_NAME")"
          echo "::notice::${GITHUB_REF_NAME} is a ${channel} release"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [ "$channel" = old ]; then
            previous="$(git tag --list "${GITHUB_REF_NAME%.*}.*" --sort=v:refname |
              awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print previous; exit } $0 !~ /-|[0-9](a|b|rc)[0-9]+$/ { previous = $0 }')"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: the release is created as a DRAFT. Drafts are excluded from
      # `releases/latest`, so the stable download URL used by README and the docs
      # (releases/latest/download/jp.co.cri-mw.spritestudio.ssplayer-unity.tgz) does NOT
      # resolve until a human publishes the draft from the GitHub Releases UI.
      # Publishing the draft is also what emits the `release: published` event that
      # triggers the Deploy Pages workflow. So after a green run: review the draft, then
      # click "Publish release".
      #
      # The draft carries its pre-release mark from the step above: none for a full
      # release or a prerelease before the first one, so `latest` resolves to it once it
      # is published, and a pre-release after that, so `latest` stays on the full release.
      - name: Upload package to release
        if: steps.release.outputs.draft == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The ref this was dispatched from, which the decision above has
          # established is a v* tag — the same string build-release.sh reported.
          tag_name: ${{ github.ref_name }}
          name: SpriteStudio Player for Unity ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.channel.outputs.channel == 'prerelease' }}
          generate_release_notes: true
          previous_tag: ${{ steps.channel.outputs.previous }}
          # The version-pinned tarball, the stable alias filename, and the
          # checksums covering both.
          files: |
            release-dist/*.tgz
            release-dist/SHA256SUMS
