name: CI (scripts)

# Syntax-checks scripts/build-runtime.sh, which is zsh - it uses ${(@kv)...},
# ${(@s/=/)...}, 1-based array indexing and the :l modifier for its argument map,
# so bash cannot parse it. SSPlayerForGodot runs its zsh steps on runners that
# ship zsh rather than installing it, and declares the shell per job; same shape
# here, on macOS.
#
# Split out of ci.yml and filtered on scripts/** deliberately. `zsh -n` catches
# syntax only, and anyone editing a build script runs it - so the check earns a
# macOS runner on the PRs that touch these files, and nothing on the ones that do
# not.
#
# NOTE: do not mark this a required check. A workflow skipped by a paths filter
# never reports a status, so a PR that touches no scripts would wait on it
# forever.
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/ci-scripts.yml'
  push:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - '.github/workflows/ci-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-zsh:
    runs-on: macos-latest
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zsh scripts parse
        run: |
          setopt ERR_EXIT
          found=0
          for f in scripts/*.sh; do
            head -1 "$f" | grep -q zsh || continue
            found=$((found + 1))
            zsh -n "$f" && echo "ok: $f"
          done
          if [[ $found -eq 0 ]]; then
            echo "No zsh scripts found - if build-runtime.sh became bash, ci.yml already covers it and this workflow can go."
          fi
