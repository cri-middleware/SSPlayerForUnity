site_name: SpriteStudioPlayer for Unity
site_description: "A Unity Engine integration for SpriteStudio 7"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSPlayerForUnity/"
repo_name: "cri-middleware/SSPlayerForUnity"
repo_url: "https://github.com/cri-middleware/SSPlayerForUnity"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            For Users: 利用者向けガイド
            Installation: インストール
            Basic Usage: 基本的な使い方
            Migration from SS6Player: SS6Player からのマイグレーション
            Asset Import & Editor Integration: アセットのインポートとエディタ連携
            Scripting & Events: スクリプト制御とイベント
            Performance Tuning & Advanced Settings: パフォーマンスチューニングと高度な設定
            Customization & Automation: カスタマイズ・自動化ガイド
            CLI Conversion & CI/CD: 各種コンバート機能と CI/CD
            For Player & SDK Developers: Player・SDK 開発者向けガイド
            Build Guide: ビルドガイド
            License: ライセンス
            Third-Party Notices: サードパーティライセンス

nav:
  - Home: index.md
  - For Users:
      - Installation: setup/install.md
      - Basic Usage: workflow/usage_basic.md
      - Asset Import & Editor Integration: workflow/usage_asset_pipeline.md
      - Scripting & Events: workflow/usage_scripting.md
      - Performance Tuning & Advanced Settings: workflow/tips.md
      - Migration from SS6Player: migration_from_ss6.md
  - Customization & Automation:
      - CLI Conversion & CI/CD: workflow/import.md
  - For Player & SDK Developers:
      - Build Guide: setup/build.md
  - License:
      - License: license.md
      - Third-Party Notices: third_party_notices.md

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true

extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ./ja/
      lang: ja
